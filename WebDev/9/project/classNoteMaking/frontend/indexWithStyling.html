<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Notes App</title>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <style>
            body {
                margin: 0;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #111;
                color: #f5f5f5;
            }

            .app-shell {
                max-width: 960px;
                margin: 0 auto;
                padding: 24px 20px;
            }

            .app-header {
                margin-bottom: 18px;
            }

            .app-header h1 {
                margin: 0 0 8px;
                font-size: 2rem;
            }

            .app-header p {
                margin: 0;
                color: #cbd5e1;
            }

            .layout {
                display: flex;
                gap: 20px;
                flex-wrap: wrap;
            }

            .notes-panel,
            .form-panel {
                background: #1b1f28;
                border: 1px solid #2a2f3a;
                border-radius: 16px;
                padding: 18px;
                flex: 1 1 320px;
                min-width: 280px;
            }

            #notes {
                min-height: 240px;
                display: grid;
                gap: 12px;
            }

            .note-card {
                background: #161a21;
                border: 1px solid #2a2f3a;
                border-radius: 12px;
                padding: 14px;
                color: #e2e8f0;
                line-height: 1.5;
            }

            .form-panel input {
                width: 100%;
                border: 1px solid #374151;
                border-radius: 10px;
                padding: 12px 14px;
                background: #0f1219;
                color: #f8fafc;
                margin-bottom: 14px;
            }

            .form-panel button {
                width: 100%;
                border: none;
                border-radius: 10px;
                padding: 12px 14px;
                background: #2563eb;
                color: white;
                font-weight: 600;
                cursor: pointer;
            }

            .form-panel button:hover {
                background: #1d4ed8;
            }
        </style>
    </head>
    <body>
        <div class="app-shell">
            <div class="app-header">
                <h1>Notes</h1>
                <p>Write a note and save it to see it appear on the left.</p>
            </div>

            <div class="layout">
                <div class="notes-panel" id="notes">
                    Loading ....
                </div>

                <div class="form-panel">
                    <input type="text" id="noteText" placeholder="Type your note here..." />
                    <button onclick="addTodo()">Create new notes</button>
                </div>
            </div>
        </div>
        <script>        
            async function addTodo(){
                const noteText = document.getElementById("noteText").value;
                await axios.post("http://localhost:3000/notes",{
                    note: noteText
                });
               
                // show the todo on the frontend
                const newNote=document.createElement("div");
                newNote.textContent = noteText;
                newNote.className = "note-card";
                document.getElementById("notes").appendChild(newNote);

                //make the input box empty again 
                document.getElementById("noteText").value = "";

            }
            async function getTodos(){
                // alert("hi");
                // const response =await fetch ("http://localhost:3000/notes")
                // const json=await response.json()
                // console.log(json.notes);

                // axios we bring this dependency to the frontend
                const response=await axios.get("http://localhost:3000/notes");
                const notes=response.data.notes;// extracting actual notes from the response
                console.log(response.data.notes);

                //removing loading 
                document.getElementById("notes").innerHTML="";

                 //populating with fetched notes
                for(let i=0;i<notes.length;i++)
                {
                    const noteNote=document.createElement("div");// created a new div
                    noteNote.innerHTML=notes[i];//in the new div add the notes which user created
                    noteNote.className = "note-card";
                    document.getElementById("notes").appendChild(noteNote) ;
                }

            }
            getTodos();// function is called on load 
        </script>
    </body>
</html>
